
services:
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: rent-a-ride-frontend
    ports:
      - "5173:5173"
    networks:
      - rent-a-ride-network
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rent-a-ride-backend
    ports:
      - "3000:3000"
    env_file:
      - .env
    networks:
      - rent-a-ride-network
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7
    container_name: rent-a-ride-mongodb
    volumes:
      - mongodb_data:/data/db
    networks:
      - rent-a-ride-network

volumes:
  mongodb_data:

networks:
  rent-a-ride-network:
    driver: bridge
