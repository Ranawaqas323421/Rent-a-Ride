services:
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: rent-a-ride-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      # Vite proxies browser /api requests to the backend over the private Compose network.
      VITE_PRODUCTION_BACKEND_URL: http://backend:3000
      VITE_RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
    networks:
      - rent-a-ride-network
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rent-a-ride-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    networks:
      - rent-a-ride-network
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  mongodb:
    image: mongo:7
    container_name: rent-a-ride-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    networks:
      - rent-a-ride-network
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  mongodb_data:

networks:
  rent-a-ride-network:
    driver: bridge
